name: vizhabook

services:
  # --- Backend REST API & WebSockets ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vizhabook-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/vizhabook?schema=public
      - JWT_SECRET=vizhabook_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy

  # --- Frontend React Web Client ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vizhabook-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # --- Local PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: vizhabook-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vizhabook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
